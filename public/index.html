<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LineHub 訊息中心</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e3e6ea; --text: #1d2329; --muted: #6b7580;
    --accent: #06c755; --accent-weak: #e6f9ee; --warn: #d9480f; --warn-weak: #fff0e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --panel: #1b1e22; --line: #2c3137; --text: #e6e9ec; --muted: #8e98a3;
      --accent: #2bd977; --accent-weak: #16301f; --warn: #ff8a4c; --warn-weak: #3a2216;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header h1 span { color: var(--accent); }
  .stats { display: flex; gap: 14px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .live { margin-left: auto; font-size: 12px; color: var(--muted); }
  .live::before { content: "●"; margin-right: 4px; color: var(--muted); }
  .live.on::before { color: var(--accent); }
  main { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  .src { display: flex; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--line); align-items: center; }
  .src:hover { background: var(--bg); }
  .src.sel { background: var(--accent-weak); }
  .src .meta { min-width: 0; flex: 1; }
  .src .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src .sub { color: var(--muted); font-size: 12px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--line); flex: none; object-fit: cover; display: grid; place-items: center; font-size: 13px; color: var(--muted); }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .tag.off { color: var(--warn); }
  section { display: flex; flex-direction: column; min-width: 0; }
  .toolbar { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .toolbar input, .toolbar select, .toolbar button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  .toolbar input { flex: 1; min-width: 160px; }
  .toolbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #list { overflow-y: auto; padding: 8px 16px 24px; flex: 1; }
  .msg { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .msg.new { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: var(--accent-weak); } to { background: transparent; } }
  .msg .body { min-width: 0; flex: 1; }
  .msg .head { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .msg .head .who { color: var(--text); font-weight: 600; }
  .msg .text { white-space: pre-wrap; word-break: break-word; }
  .msg.unsent .text { text-decoration: line-through; color: var(--muted); }
  .msg img.media { max-width: 240px; max-height: 200px; border-radius: 6px; margin-top: 4px; display: block; }
  .alert { color: var(--warn); background: var(--warn-weak); padding: 0 6px; border-radius: 6px; font-size: 12px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .more { display: block; margin: 12px auto; }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: 180px 1fr; height: auto; min-height: calc(100vh - 53px); }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Line<span>Hub</span> 訊息中心</h1>
  <div class="stats" id="stats"></div>
  <div class="live" id="live">即時連線</div>
</header>
<main>
  <aside id="sources"></aside>
  <section>
    <div class="toolbar">
      <input id="q" type="search" placeholder="搜尋訊息內容…">
      <select id="type">
        <option value="">全部類型</option>
        <option value="text">文字</option><option value="image">圖片</option><option value="video">影片</option>
        <option value="audio">語音</option><option value="file">檔案</option><option value="sticker">貼圖</option>
        <option value="location">位置</option>
      </select>
      <button id="alertsBtn">關鍵字警示</button>
    </div>
    <div id="list"></div>
  </section>
</main>
<script>
const state = { sourceId: '', q: '', type: '', alerts: false, sources: [], oldest: null };
const $ = (s) => document.querySelector(s);
const token = () => { try { return localStorage.getItem('linehubToken') || ''; } catch { return ''; } };
const withToken = (u) => token() ? u + (u.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token()) : u;

async function api(path) {
  const res = await fetch(withToken(path));
  if (res.status === 401) {
    const t = prompt('請輸入 ADMIN_TOKEN');
    if (t) { try { localStorage.setItem('linehubToken', t); } catch {} return api(path); }
    throw new Error('unauthorized');
  }
  return res.json();
}

const fmtTime = (ts) => new Date(ts).toLocaleString('zh-TW', { hour12: false });
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function avatar(url, label) {
  if (url) { const i = el('img', 'avatar'); i.src = url; i.alt = ''; i.loading = 'lazy'; return i; }
  return el('div', 'avatar', (label || '?').slice(0, 1));
}
const typeLabel = { group: '群組', room: '多人聊天', user: '一對一' };

async function loadStats() {
  const s = await api('/api/stats');
  const box = $('#stats'); box.replaceChildren();
  [['群組', s.activeGroups], ['使用者', s.users], ['訊息', s.messages], ['警示', s.alerts]].forEach(([k, v]) => {
    const span = el('span', null, k + ' '); span.append(el('b', null, v)); box.append(span);
  });
}

async function loadSources() {
  state.sources = await api('/api/sources');
  const box = $('#sources'); box.replaceChildren();
  const all = el('div', 'src' + (state.sourceId ? '' : ' sel'));
  const allMeta = el('div', 'meta');
  allMeta.append(el('div', 'name', '全部聊天室'), el('div', 'sub', `${state.sources.length} 個來源`));
  all.append(avatar(null, '全'), allMeta);
  all.onclick = () => select('');
  box.append(all);
  for (const s of state.sources) {
    const row = el('div', 'src' + (state.sourceId === s.id ? ' sel' : ''));
    const meta = el('div', 'meta');
    const sub = el('div', 'sub');
    sub.append(el('span', 'tag' + (s.active ? '' : ' off'), s.active ? typeLabel[s.type] || s.type : '已離開'),
      ` ${s.message_count} 則` + (s.member_count ? ` · ${s.member_count} 人` : ''));
    meta.append(el('div', 'name', s.name || s.id), sub);
    row.append(avatar(s.picture_url, s.name), meta);
    row.title = s.id;
    row.onclick = () => select(s.id);
    box.append(row);
  }
}

function renderMessage(m, isNew) {
  const row = el('div', 'msg' + (m.unsent ? ' unsent' : '') + (isNew ? ' new' : ''));
  row.dataset.id = m.id;
  const body = el('div', 'body');
  const head = el('div', 'head');
  head.append(el('span', 'who', m.sender?.name || m.sender?.id || '(未知)'));
  if (!state.sourceId) head.append(el('span', null, '@ ' + (m.source?.name || m.source?.id)));
  head.append(el('span', null, fmtTime(m.timestamp)));
  if (m.unsent) head.append(el('span', 'alert', '已收回'));
  for (const k of m.alerts || []) head.append(el('span', 'alert', '⚠ ' + k));
  body.append(head, el('div', 'text', m.text));
  if (m.mediaPath && m.type === 'image') {
    const img = el('img', 'media'); img.src = withToken('/media/' + m.mediaPath); img.loading = 'lazy'; body.append(img);
  } else if (m.mediaPath) {
    const a = el('a', null, '下載 ' + m.type); a.href = withToken('/media/' + m.mediaPath); a.target = '_blank'; body.append(a);
  }
  row.append(avatar(m.sender?.pictureUrl, m.sender?.name), body);
  return row;
}

async function loadMessages(append = false) {
  const list = $('#list');
  if (state.alerts) return loadAlerts();
  const p = new URLSearchParams({ limit: 50 });
  if (state.sourceId) p.set('sourceId', state.sourceId);
  if (state.q) p.set('q', state.q);
  if (state.type) p.set('type', state.type);
  if (append && state.oldest) p.set('before', state.oldest);
  const msgs = await api('/api/messages?' + p);
  if (!append) list.replaceChildren();
  list.querySelector('.more')?.remove();
  if (!msgs.length && !append) return list.append(el('div', 'empty', '尚無訊息。把官方帳號邀請進群組後，新訊息會即時出現在這裡。'));
  msgs.forEach((m) => list.append(renderMessage(m)));
  state.oldest = msgs.at(-1)?.timestamp;
  if (msgs.length === 50) {
    const more = el('button', 'more', '載入更早的訊息'); more.onclick = () => loadMessages(true); list.append(more);
  }
}

async function loadAlerts() {
  const list = $('#list'); list.replaceChildren();
  const rows = await api('/api/alerts');
  if (!rows.length) return list.append(el('div', 'empty', '尚無警示。可在 .env 設定 ALERT_KEYWORDS。'));
  for (const a of rows) {
    list.append(renderMessage({ id: a.message_id, sender: { name: a.display_name, id: a.user_id },
      source: { name: a.source_name, id: a.source_id }, timestamp: a.created_at, text: a.text, alerts: [a.keyword] }));
  }
}

function select(id) {
  state.sourceId = id; state.alerts = false; $('#alertsBtn').classList.remove('active');
  loadSources(); loadMessages();
}

function matchesFilter(m) {
  if (state.alerts) return false;
  if (state.sourceId && m.source.id !== state.sourceId) return false;
  if (state.type && m.type !== state.type) return false;
  if (state.q && !(m.text || '').includes(state.q)) return false;
  return true;
}

function connect() {
  const es = new EventSource(withToken('/api/stream'));
  es.onopen = () => $('#live').classList.add('on');
  es.onerror = () => $('#live').classList.remove('on');
  let pending = null;
  const refreshSide = () => { clearTimeout(pending); pending = setTimeout(() => { loadSources(); loadStats(); }, 400); };
  es.addEventListener('message', (e) => {
    const m = JSON.parse(e.data);
    if (matchesFilter(m)) {
      const list = $('#list'); list.querySelector('.empty')?.remove();
      list.prepend(renderMessage(m, true));
    }
    refreshSide();
  });
  es.addEventListener('alert', refreshSide);
  es.addEventListener('unsend', (e) => {
    const { messageId } = JSON.parse(e.data);
    document.querySelector(`.msg[data-id="${CSS.escape(messageId)}"]`)?.classList.add('unsent');
  });
}

let t;
$('#q').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); loadMessages(); }, 300); };
$('#type').onchange = (e) => { state.type = e.target.value; loadMessages(); };
$('#alertsBtn').onclick = () => { state.alerts = !state.alerts; $('#alertsBtn').classList.toggle('active', state.alerts); loadMessages(); };

Promise.all([loadStats(), loadSources(), loadMessages()]).then(connect);
</script>
</body>
</html>
